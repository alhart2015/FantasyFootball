[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projections"
version = "0.0.1"
description = "FantasyFootball Projections Core"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pandera>=0.20",
    "duckdb>=1.0",
    "joblib>=1.3",
    "nfl_data_py>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "mypy>=1.9",
    "ruff>=0.5",
    "types-setuptools",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["nfl_data_py.*", "pandera.*", "scipy.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.format]
# Defaults: black-compatible, double quotes, trailing commas in multi-line.
# No overrides needed for v1.

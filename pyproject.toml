[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projections"
version = "0.0.1"
description = "FantasyFootball Projections Core"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pandera>=0.20",
    "duckdb>=1.0",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "msgpack>=1.0",
    "optuna>=3.0",
    "optuna-integration[lightgbm]>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "mypy>=1.9",
    "ruff>=0.5",
    "types-setuptools",
    "pre-commit>=3.6",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit the live nflreadpy / nflverse releases; skipped by default",
    "backtest: tests that run the full walk-forward backtest gate; skipped without --run-backtest",
]
# Mirror the module-scope filters in scripts/tune_lightgbm.py — pytest's per-
# test catch_warnings() resets the warning state, so module-level
# warnings.filterwarnings() calls are not honoured during test runs. The
# Optuna LightGBMPruningCallback reports the same step number across the
# 5 quantile sub-fits per trial, producing thousands of duplicate
# "value already reported" warnings; suppress at the pytest level too.
filterwarnings = [
    "ignore:.*reported value.*already reported.*:UserWarning",
    "ignore::UserWarning:lightgbm",
]

[tool.mypy]
strict = true
python_version = "3.11"
# scripts/ is on the path so test_scripts/ tests (which import script modules
# directly via tests/test_scripts/conftest.py) type-check cleanly.
mypy_path = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["nflreadpy.*", "pandera.*", "scipy.*", "joblib.*", "pandas.*", "sklearn.*", "msgpack.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.format]
# Defaults: black-compatible, double quotes, trailing commas in multi-line.
# No overrides needed for v1.
